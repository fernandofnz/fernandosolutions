<style>

:root{
  --bg:#F3F6F4; --surface:#FFFFFF; --ink:#16201B; --muted:#5E6B64; --line:#DCE3DF;
  --accent:#1E6A4E; --accent-soft:#E2F0E9; --hi:#B4472C; --hi-soft:#F8E6E0; --mid:#9A6B10; --mid-soft:#F6EED9;

  --body:"Figtree",ui-sans-serif,system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1512; --surface:#18211C; --ink:#E4ECE7; --muted:#97A59D; --line:#2A362F;
  --accent:#5CC89C; --accent-soft:#1D3329; --hi:#F08B6E; --hi-soft:#3A221B; --mid:#E2B654; --mid-soft:#352B16;
  --low:#9AA59F; --low-soft:#232C27; --done:#5CC89C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1512; --surface:#18211C; --ink:#E4ECE7; --muted:#97A59D; --line:#2A362F;
  --accent:#5CC89C; --accent-soft:#1D3329; --hi:#F08B6E; --hi-soft:#3A221B; --mid:#E2B654; --mid-soft:#352B16;
  --low:#9AA59F; --low-soft:#232C27; --done:#5CC89C; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:20px 48px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(1.6rem,3vw,2.2rem)}
header.top{display:flex;flex-wrap:wrap;gap:16px 32px;align-items:end;justify-content:space-between;padding-bottom:16px;border-bottom:1px solid var(--line)}
.sub{color:var(--muted);margin:4px 0 0}
.stats{display:flex;gap:20px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.stat b{display:block;font-family:var(--display);font-size:1.5rem;line-height:1}
.stat span{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:12px;width:100%}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.sync{font-size:.8rem;color:var(--muted);margin-top:6px}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding-block:16px}
.tools input[type=search]{flex:1 1 220px;min-width:0;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 11px;border-radius:999px;font:inherit;font-size:.85rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:28px;align-items:start}
nav.toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);max-height:calc(100vh - 24px);overflow:auto;padding-right:6px}
.toc h2{font-size:1rem;margin-bottom:8px}
.toc details{margin-bottom:6px}
.toc summary{cursor:pointer;font-weight:600;font-size:.85rem;padding:4px 0;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.toc ol{list-style:none;margin:2px 0 8px;padding:0}
.toc button{all:unset;cursor:pointer;display:flex;gap:8px;align-items:center;width:100%;padding:3px 4px;border-radius:5px;font-size:.88rem}
.toc button:hover,.toc button:focus-visible{background:var(--accent-soft)}
.toc button:focus-visible{outline:2px solid var(--accent)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--line)}
.dot.p-A{background:var(--hi)}.dot.p-MA{background:var(--hi);opacity:.55}.dot.p-M{background:var(--mid)}.dot.p-B{background:var(--low)}
.toc .ok{text-decoration:line-through;color:var(--muted)}
section.city{margin-bottom:32px}
section.city h2{font-size:1.25rem;display:flex;gap:10px;align-items:baseline;margin-bottom:12px}
section.city h2 small{font-family:var(--body);font-weight:500;font-size:.85rem;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--accent)}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card h3{font-size:1.02rem;line-height:1.25}
.card .seg{color:var(--muted);font-size:.85rem}
.card .row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto;font-size:.8rem;font-variant-numeric:tabular-nums}
.card.is-done{opacity:.7}
.pill{display:inline-block;font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:999px;letter-spacing:.03em;text-transform:uppercase}
.pill.p-A,.pill.p-MA{background:var(--hi-soft);color:var(--hi)}
.pill.p-M{background:var(--mid-soft);color:var(--mid)}
.pill.p-B{background:var(--low-soft);color:var(--low)}
.pill.ok{background:var(--accent-soft);color:var(--done)}
.mini{height:4px;background:var(--line);border-radius:2px;overflow:hidden;flex:1;max-width:90px}
.mini i{display:block;height:100%;background:var(--accent)}
.empty{color:var(--muted);padding:24px 0}
dialog{border:none;border-radius:14px;padding:0;width:min(680px,calc(100vw - 24px));max-height:calc(100vh - 32px);background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(10,20,15,.55)}
.m-head{position:sticky;top:0;background:var(--surface);padding:18px 20px 12px;border-bottom:1px solid var(--line);display:flex;gap:12px;justify-content:space-between;align-items:start;z-index:1}
.m-head h2{font-size:1.35rem}
.m-head .meta{color:var(--muted);font-size:.88rem;margin-top:4px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.x{all:unset;cursor:pointer;font-size:1.5rem;line-height:1;padding:4px 8px;border-radius:6px;color:var(--muted)}
.x:hover,.x:focus-visible{background:var(--line);color:var(--ink)}
.m-body{padding:16px 20px;display:grid;gap:18px}
.info{display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px 14px;font-size:.92rem}
.info dt{color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;padding-top:2px}
.info dd{margin:0;min-width:0;overflow-wrap:anywhere}
.phone{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:4px}
.phone code{font-family:var(--mono);font-size:.88rem;user-select:all}
.sbtn{font:inherit;font-size:.75rem;padding:2px 8px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;text-decoration:none}
.sbtn:hover{border-color:var(--accent)}
.links{display:flex;flex-wrap:wrap;gap:6px}
.links a{font-size:.85rem;color:var(--accent);text-decoration:none;border:1px solid var(--line);padding:3px 10px;border-radius:999px}
.links a:hover{border-color:var(--accent)}
fieldset{border:none;padding:0;margin:0}
legend{font-family:var(--display);font-weight:700;font-size:1rem;margin-bottom:6px;padding:0}
.check{display:flex;gap:10px;align-items:flex-start;padding:7px 8px;border-radius:7px;cursor:pointer}
.check:hover{background:var(--bg)}
.check input{width:18px;height:18px;margin:1px 0 0;accent-color:var(--accent);flex:none}
.check input:checked+span{text-decoration:line-through;color:var(--muted)}
textarea{width:100%;min-height:70px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;resize:vertical}
.m-foot{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:14px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.m-foot .check{font-weight:600;padding:4px 0}
.m-foot .check input:checked+span{text-decoration:none;color:var(--done)}
.btn{font:inherit;font-weight:600;padding:9px 16px;border-radius:8px;border:1px solid transparent;cursor:pointer}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.danger{background:var(--hi);color:var(--surface)}
.btn.danger:disabled{background:var(--line);color:var(--muted);cursor:not-allowed}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--surface)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.9rem}
.hint{font-size:.8rem;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:.9rem;z-index:10}
@media (max-width:820px){

  .info{grid-template-columns:minmax(0,1fr)}
  .info dt{padding-top:6px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const slug=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
DATA.forEach(e=>{e.id=slug(e.c+"-"+e.n)});

/* ---------- estado ---------- */
let ST={};          // id -> {e:{i:true}, p:{i:true}, done:bool, del:bool, nota:string}
let db=null, filterCity="all", filterPrio="all", showDel=false, openId=null;
const LSKEY="prospeccao-abc-v1";
const get=id=>ST[id]||{e:{},p:{},done:false,del:false,nota:""};
function lsLoad(){try{const v=localStorage.getItem(LSKEY);if(v)ST=JSON.parse(v)||{}}catch(_){}}
function lsSave(){try{localStorage.setItem(LSKEY,JSON.stringify(ST))}catch(_){}}

const writing={}, pending={};
async function persist(id){
  lsSave();
  if(!db) return;
  if(writing[id]){pending[id]=true;return}
  writing[id]=true;
  try{ await db.collection("progress").doc(id).set(JSON.parse(JSON.stringify(get(id)))); setSync(true) }
  catch(err){ setSync(false, err && err.code) }
  writing[id]=false;
  if(pending[id]){pending[id]=false;persist(id)}
}
function update(id,fn){const s=JSON.parse(JSON.stringify(get(id)));fn(s);ST[id]=s;persist(id);renderAll()}

function setSync(ok,code){
  const el=document.getElementById("sync");
  if(ok) el.textContent="Progresso salvo na nuvem: abre igual em qualquer aparelho.";
  else if(code==="invalid_argument") el.textContent="Sem permissão para salvar na nuvem. O progresso fica só neste navegador.";
  else el.textContent="Progresso salvo só neste navegador.";
}

/* ---------- render ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function total(e){return ETAPAS.length+e.x.length}
function doneCount(e){const s=get(e.id);return Object.values(s.e||{}).filter(Boolean).length+Object.values(s.p||{}).filter(Boolean).length}
function visible(e){
  const s=get(e.id);
  if(!!s.del!==showDel) return false;
  if(filterCity!=="all"&&e.c!==filterCity) return false;
  if(filterPrio!=="all"&&(filterPrio==="A"?!(e.p==="A"||e.p==="MA"):e.p!==filterPrio)) return false;
  const q=$("#q").value.trim().toLowerCase();
  if(q){const hay=(e.n+" "+e.s+" "+e.a+" "+CITIES[e.c]).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
    if(!hay.includes(q.normalize("NFD").replace(/[̀-ͯ]/g,""))) return false}
  return true;
}
function sorted(list){return list.slice().sort((a,b)=>(get(a.id).done-get(b.id).done)||(PORD[a.p]-PORD[b.p])||a.n.localeCompare(b.n,"pt"))}

function renderStats(){
  const act=DATA.filter(e=>!get(e.id).del), del=DATA.length-act.length, done=act.filter(e=>get(e.id).done).length;
  $("#sAtivos").textContent=act.length; $("#sDone").textContent=done; $("#sDel").textContent=del;
  $("#bar").style.width=((done+del)/DATA.length*100)+"%";
  $("#showDel").textContent=showDel?"Voltar para a lista":"Ver excluídos ("+del+")";
}
function renderChips(){
  const cc=[["all","Todas"]].concat(Object.entries(CITIES));
  $("#cityChips").innerHTML=cc.map(([k,v])=>`<button class="chip" data-city="${k}" aria-pressed="${filterCity===k}">${v}</button>`).join("");
  const pc=[["all","Toda prioridade"],["A","Alta"],["M","Média"],["B","Baixa"]];
  $("#prioChips").innerHTML=pc.map(([k,v])=>`<button class="chip" data-prio="${k}" aria-pressed="${filterPrio===k}">${v}</button>`).join("");
}
function renderMain(){
  let html="", toc="";
  for(const [code,name] of Object.entries(CITIES)){
    const list=sorted(DATA.filter(e=>e.c===code&&visible(e)));
    if(!list.length) continue;
    html+=`<section class="city" id="city-${code}"><h2>${name} <small>${list.length} ${list.length===1?"estabelecimento":"estabelecimentos"}</small></h2><div class="grid">`;
    toc+=`<details open><summary>${name} (${list.length})</summary><ol>`;
    for(const e of list){
      const s=get(e.id), d=doneCount(e), t=total(e);
      html+=`<button class="card${s.done?" is-done":""}" data-open="${e.id}">
        <div style="display:flex;justify-content:space-between;gap:8px;align-items:start"><h3>${esc(e.n)}</h3><span class="pill p-${e.p}">${PRIO[e.p]}</span></div>
        <div class="seg">${esc(e.s)}</div>
        <div class="row">${s.done?'<span class="pill ok">Prospecção concluída</span>':`<span>${d} de ${t} feitos</span>`}<span class="mini"><i style="width:${d/t*100}%"></i></span></div>
      </button>`;
      toc+=`<li><button data-open="${e.id}"><span class="dot p-${e.p}"></span><span class="${s.done?"ok":""}">${esc(e.n)}</span></button></li>`;
    }
    html+=`</div></section>`; toc+=`</ol></details>`;
  }
  $("#main").innerHTML=html||`<p class="empty">${showDel?"Nenhum estabelecimento excluído ainda. Quando concluir a prospecção de um, abra o cartão e use “Excluir estabelecimento”.":"Nenhum estabelecimento com esses filtros."}</p>`;
  $("#toc").innerHTML=toc||`<p class="hint">Nada para mostrar.</p>`;
}
function renderAll(){
  renderStats();renderChips();renderMain();
  if(openId&&$("#dlg").open){
    const a=document.activeElement, fid=a&&a.id;
    if(fid==="nota") return;            // não interrompe quem está digitando
    renderDialog(openId,true);
    if(fid){const el=document.getElementById(fid); if(el) el.focus({preventScroll:true})}
  }
}

function waLink(p){const d=p.replace(/\D/g,"");return d.length===11&&d[2]==="9"?"https://wa.me/55"+d:null}
function renderDialog(id,keep){
  const e=DATA.find(x=>x.id===id); if(!e) return;
  const s=get(id), dlg=$("#dlg");
  const scroll=keep?(dlg.querySelector(".m-scroll")||{}).scrollTop:0;
  const nota=keep&&document.getElementById("nota")?document.getElementById("nota").value:(s.nota||"");
  const phones=e.t.length?e.t.map(p=>{const w=waLink(p);return `<div class="phone"><code>${p}</code><button class="sbtn" data-copy="${p}">Copiar</button>${w?`<a class="sbtn" href="${w}" target="_blank" rel="noopener">WhatsApp</a>`:""}</div>`}).join(""):"Não encontrado";
  const links=e.l.length?`<div class="links">${e.l.map(([lab,url])=>`<a href="${esc(url)}" target="_blank" rel="noopener">${esc(lab)}</a>`).join("")}</div>`:"Não encontrado";
  const chk=(grp,i,txt,on)=>`<label class="check"><input type="checkbox" id="c-${grp}-${i}" data-grp="${grp}" data-i="${i}" ${on?"checked":""}><span>${esc(txt)}</span></label>`;
  dlg.innerHTML=`<div class="m-scroll" style="max-height:calc(100vh - 32px);overflow:auto">
    <div class="m-head"><div style="min-width:0"><h2 id="dName">${esc(e.n)}</h2>
      <div class="meta"><span>${CITIES[e.c]}</span>·<span>${esc(e.s)}</span><span class="pill p-${e.p}">Prioridade ${PRIO[e.p]}</span></div></div>
      <button class="x" data-close aria-label="Fechar">×</button></div>
    <div class="m-body">
      <dl class="info">
        <dt>Endereço</dt><dd>${esc(e.a)}</dd>
        <dt>Telefones</dt><dd>${phones}</dd>
        <dt>Links</dt><dd>${links}</dd>
        <dt>Situação hoje</dt><dd>${esc(e.h)}</dd>
      </dl>
      <fieldset><legend>Etapas da prospecção</legend>${ETAPAS.map((t,i)=>chk("e",i,t,s.e&&s.e[i])).join("")}</fieldset>
      <fieldset><legend>Propostas para oferecer</legend>${e.x.map((t,i)=>chk("p",i,t,s.p&&s.p[i])).join("")}</fieldset>
      <div><label for="nota" style="font-family:var(--display);font-weight:700;display:block;margin-bottom:6px">Anotações</label>
      <textarea id="nota" placeholder="Ex.: falei com o dono, pediu retorno sexta à tarde">${esc(nota)}</textarea></div>
    </div>
    <div class="m-foot">
      ${s.del?`<span class="hint">Este estabelecimento está excluído da lista.</span><button class="btn primary" data-restore>Restaurar na lista</button>`:
      `<label class="check"><input type="checkbox" id="c-done" data-done ${s.done?"checked":""}><span>Já fiz a prospecção</span></label>
      <div id="delZone">${s.done?`<button class="btn danger" data-del>Excluir estabelecimento</button>`:`<button class="btn danger" disabled title="Marque “Já fiz a prospecção” primeiro">Excluir estabelecimento</button>`}</div>`}
    </div></div>`;
  if(keep) dlg.querySelector(".m-scroll").scrollTop=scroll||0;
}
function openDlg(id){openId=id;renderDialog(id);const d=$("#dlg");if(!d.open)d.showModal()}
function closeDlg(){saveNota();$("#dlg").close();openId=null}

let notaTimer=null;
function saveNota(){if(!openId)return;const el=document.getElementById("nota");if(!el)return;clearTimeout(notaTimer);
  if((get(openId).nota||"")!==el.value){const id=openId,v=el.value;const s=JSON.parse(JSON.stringify(get(id)));s.nota=v;ST[id]=s;persist(id)}}

function toast(t){const el=$("#toast");el.textContent=t;el.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>el.hidden=true,2200)}

/* ---------- eventos ---------- */
document.addEventListener("click",ev=>{
  const o=ev.target.closest("[data-open]"); if(o){openDlg(o.dataset.open);return}
  const c=ev.target.closest("[data-city]"); if(c){filterCity=c.dataset.city;renderAll();return}
  const p=ev.target.closest("[data-prio]"); if(p){filterPrio=p.dataset.prio;renderAll();return}
  if(ev.target.closest("#showDel")){showDel=!showDel;$("#showDel").setAttribute("aria-pressed",showDel);renderAll();return}
  if(ev.target.closest("[data-close]")){closeDlg();return}
  const cp=ev.target.closest("[data-copy]"); if(cp){const v=cp.dataset.copy;
    Promise.resolve().then(()=>navigator.clipboard.writeText(v)).then(()=>toast("Copiado: "+v)).catch(()=>{const r=document.createRange();r.selectNodeContents(cp.previousElementSibling);const s=getSelection();s.removeAllRanges();s.addRange(r);toast("Número selecionado: use Ctrl+C")});return}
  if(ev.target.closest("[data-del]")){
    $("#delZone").innerHTML=`<div class="confirm"><span>Tirar da lista?</span><button class="btn danger" data-delok>Confirmar exclusão</button><button class="btn ghost" data-delno>Cancelar</button></div>`;return}
  if(ev.target.closest("[data-delno]")){renderDialog(openId,true);return}
  if(ev.target.closest("[data-delok]")){const id=openId,n=DATA.find(x=>x.id===id).n;saveNota();update(id,s=>{s.del=true});closeDlg();toast(n+" foi excluído. Veja em “Ver excluídos”.");return}
  if(ev.target.closest("[data-restore]")){const id=openId;update(id,s=>{s.del=false;s.done=false});closeDlg();toast("Restaurado na lista");return}
});
document.addEventListener("change",ev=>{
  const t=ev.target;
  if(t.dataset.grp){const g=t.dataset.grp,i=t.dataset.i;saveNota();update(openId,s=>{s[g]=s[g]||{};if(t.checked)s[g][i]=true;else delete s[g][i]})}
  else if(t.hasAttribute("data-done")){saveNota();update(openId,s=>{s.done=t.checked})}
});
document.addEventListener("input",ev=>{
  if(ev.target.id==="q"){renderMain();return}
  if(ev.target.id==="nota"){clearTimeout(notaTimer);notaTimer=setTimeout(saveNota,800)}
});
$("#dlg").addEventListener("close",()=>{saveNota();openId=null});
$("#dlg").addEventListener("click",ev=>{if(ev.target===ev.currentTarget)closeDlg()});

/* ---------- início ---------- */
lsLoad(); renderAll(); setSync(false);
(async()=>{
  try{ db = window.claude && await window.claude.use("db") }catch(_){ db=null }
  if(!db){ setSync(false); return }
  db.collection("progress").onSnapshot(snap=>{
    const next={};
    snap.docs.forEach(d=>{ if(d.exists) next[d.id]=d.data() });
    // primeira vez: leva para a nuvem o que já estava salvo só no navegador
    if(snap.empty && Object.keys(ST).length && !persist._migrated){persist._migrated=true;Object.keys(ST).forEach(id=>persist(id));return}
    ST=next; lsSave(); setSync(true); renderAll();
  },err=>{ db=null; setSync(false, err&&err.code) });
})();
</script>
